<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="case-title case-desc" data-case-id="oll:1" data-case-name="OLL 1" data-case-kind="oll" data-signature="1212|1111" data-representative-signature="1212|1111" data-view="U-top-down-standard-frame" data-diagram-style="compact-3x3">
<title id="case-title">OLL 1 — orientation diagram</title>
<desc id="case-desc">Top-down U-face orientation in the compact 3×3 diagram convention. Nine square cells show the U face: yellow cells are U stickers facing up and neutral gray cells are other sticker colors. Thin yellow bars outside the grid mark U stickers facing sideways at their adjacent face positions; positions without a bar have no sideways-facing U sticker. Canonical orientation signature 1212|1111. Viewing orientation: standard frame, U face on top, F at the bottom.</desc>
<rect class="grid-background" x="18" y="18" width="92" height="92" fill="#111418"/>
<g class="top-face"><rect class="sticker" data-face="U" data-position="UBL" data-sticker-color="B" x="20" y="20" width="28" height="28" fill="#C3CBD3"/><rect class="sticker" data-face="U" data-position="UB" data-sticker-color="B" x="50" y="20" width="28" height="28" fill="#C3CBD3"/><rect class="sticker" data-face="U" data-position="UBR" data-sticker-color="B" x="80" y="20" width="28" height="28" fill="#C3CBD3"/><rect class="sticker" data-face="U" data-position="UL" data-sticker-color="L" x="20" y="50" width="28" height="28" fill="#C3CBD3"/><rect class="sticker" data-face="U" data-position="U" data-sticker-color="U" x="50" y="50" width="28" height="28" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UR" data-sticker-color="R" x="80" y="50" width="28" height="28" fill="#C3CBD3"/><rect class="sticker" data-face="U" data-position="UFL" data-sticker-color="F" x="20" y="80" width="28" height="28" fill="#C3CBD3"/><rect class="sticker" data-face="U" data-position="UF" data-sticker-color="F" x="50" y="80" width="28" height="28" fill="#C3CBD3"/><rect class="sticker" data-face="U" data-position="UFR" data-sticker-color="F" x="80" y="80" width="28" height="28" fill="#C3CBD3"/></g>
<g class="side-bars"><rect class="side-bar" data-face="B" data-position="UB" data-sticker-color="U" x="50" y="10" width="28" height="5" fill="#FFF200" stroke="#111418" stroke-width="1.25"/><rect class="side-bar" data-face="F" data-position="UF" data-sticker-color="U" x="50" y="113" width="28" height="5" fill="#FFF200" stroke="#111418" stroke-width="1.25"/><rect class="side-bar" data-face="L" data-position="UBL" data-sticker-color="U" x="10" y="20" width="5" height="28" fill="#FFF200" stroke="#111418" stroke-width="1.25"/><rect class="side-bar" data-face="L" data-position="UL" data-sticker-color="U" x="10" y="50" width="5" height="28" fill="#FFF200" stroke="#111418" stroke-width="1.25"/><rect class="side-bar" data-face="L" data-position="UFL" data-sticker-color="U" x="10" y="80" width="5" height="28" fill="#FFF200" stroke="#111418" stroke-width="1.25"/><rect class="side-bar" data-face="R" data-position="UBR" data-sticker-color="U" x="113" y="20" width="5" height="28" fill="#FFF200" stroke="#111418" stroke-width="1.25"/><rect class="side-bar" data-face="R" data-position="UR" data-sticker-color="U" x="113" y="50" width="5" height="28" fill="#FFF200" stroke="#111418" stroke-width="1.25"/><rect class="side-bar" data-face="R" data-position="UFR" data-sticker-color="U" x="113" y="80" width="5" height="28" fill="#FFF200" stroke="#111418" stroke-width="1.25"/></g>
</svg>