<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="case-title case-desc" data-case-id="pll:v" data-case-name="V" data-case-kind="pll" data-signature="UBL,UBR,UFR,UFL|UB,UL,UR,UF" data-representative-signature="UBL,UBR,UFR,UFL|UF,UB,UR,UL" data-view="U-top-down-standard-frame" data-diagram-style="compact-3x3">
<title id="case-title">V — permutation diagram</title>
<desc id="case-desc">Top-down U-face permutation in the compact 3×3 diagram convention. All nine U-face cells are yellow. Thin bars outside the grid show the actual side sticker colors: green front, red right, blue back and orange left. Black arrows show where corner and edge pieces move, from their current position to their home position; a double-headed arrow marks a two-piece swap. Canonical pre/post-AUF permutation signature UBL,UBR,UFR,UFL|UB,UL,UR,UF. Viewing orientation: standard frame, U face on top, F at the bottom.</desc>
<rect class="grid-background" x="20" y="20" width="88" height="88" fill="#111418"/>
<g class="top-face"><rect class="sticker" data-face="U" data-position="UBL" data-sticker-color="U" x="23" y="23" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UB" data-sticker-color="U" x="51" y="23" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UBR" data-sticker-color="U" x="79" y="23" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UL" data-sticker-color="U" x="23" y="51" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="U" data-sticker-color="U" x="51" y="51" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UR" data-sticker-color="U" x="79" y="51" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UFL" data-sticker-color="U" x="23" y="79" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UF" data-sticker-color="U" x="51" y="79" width="26" height="26" fill="#FFF200"/><rect class="sticker" data-face="U" data-position="UFR" data-sticker-color="U" x="79" y="79" width="26" height="26" fill="#FFF200"/></g>
<g class="side-strips"><rect class="side-strip" data-face="B" x="20" y="13.5" width="88" height="8.5" fill="#111418"/><rect class="side-strip" data-face="F" x="20" y="106" width="88" height="8.5" fill="#111418"/><rect class="side-strip" data-face="L" x="13.5" y="20" width="8.5" height="88" fill="#111418"/><rect class="side-strip" data-face="R" x="106" y="20" width="8.5" height="88" fill="#111418"/></g>
<g class="side-bars"><rect class="side-bar" data-face="B" data-position="UBL" data-sticker-color="F" x="22" y="14.5" width="28" height="6.5" fill="#00C853" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="B" data-position="UB" data-sticker-color="R" x="50" y="14.5" width="28" height="6.5" fill="#FF3030" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="B" data-position="UBR" data-sticker-color="B" x="78" y="14.5" width="28" height="6.5" fill="#2962FF" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="F" data-position="UFL" data-sticker-color="F" x="22" y="107" width="28" height="6.5" fill="#00C853" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="F" data-position="UF" data-sticker-color="F" x="50" y="107" width="28" height="6.5" fill="#00C853" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="F" data-position="UFR" data-sticker-color="B" x="78" y="107" width="28" height="6.5" fill="#2962FF" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="L" data-position="UBL" data-sticker-color="R" x="14.5" y="22" width="6.5" height="28" fill="#FF3030" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="L" data-position="UL" data-sticker-color="L" x="14.5" y="50" width="6.5" height="28" fill="#FF8A00" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="L" data-position="UFL" data-sticker-color="L" x="14.5" y="78" width="6.5" height="28" fill="#FF8A00" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="R" data-position="UBR" data-sticker-color="R" x="107" y="22" width="6.5" height="28" fill="#FF3030" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="R" data-position="UR" data-sticker-color="B" x="107" y="50" width="6.5" height="28" fill="#2962FF" stroke="#111418" stroke-width="2"/><rect class="side-bar" data-face="R" data-position="UFR" data-sticker-color="L" x="107" y="78" width="6.5" height="28"