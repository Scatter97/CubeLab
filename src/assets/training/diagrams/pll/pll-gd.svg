<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="case-title case-desc" data-case-id="pll:gd" data-case-name="Gd" data-case-kind="pll" data-signature="UBL,UBR,UFL,UFR|UF,UL,UR,UB" data-representative-signature="UFL,UBR,UFR,UBL|UR,UL,UB,UF" data-view="U-top-down-standard-frame" data-diagram-style="compact-3x3">
<title id="case-title">Gd — permutation diagram</title>
<desc id="case-desc">Top-down U-face permutation in the compact 3×3 diagram convention. All nine U-face cells are yellow. Thin bars outside the grid show the actual side sticker colors: green front, red right, blue back and orange left. Black arrows show where corner and edge pieces move, from their current position to their home position; a double-headed arrow marks a two-piece swap. Canonical pre/post-AUF permutation signature UBL,UBR,UFL,UFR|UF,UL,UR,UB. Viewing orientation: standard frame, U face on top, F at the bottom.</desc>
<rect class="grid-background" x="20" y="20" width="88" height="88" fill="#111418"/>
